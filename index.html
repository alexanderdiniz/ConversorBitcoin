<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mempool Pro - Painel de Controle Bitcoin</title>
    <style>
        :root {
            --bg-color: #11131f;
            --card-bg: #181b2d;
            --btc-orange: #f7931a;
            --text-main: #ffffff;
            --text-secondary: #94a3b8;
            --border-color: #2d334a;
            --accent-green: #24d27d;
            --input-bg: #11131f;
            --shadow: rgba(0,0,0,0.4);
            --transition: all 0.2s ease-in-out;
        }

        body.light-mode {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-secondary: #64748b;
            --border-color: #e2e8f0;
            --input-bg: #f1f5f9;
            --shadow: rgba(0,0,0,0.08);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            transition: background-color 0.3s;
        }

        header {
            width: 100%;
            max-width: 1000px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .logo { font-size: 1.5rem; font-weight: 800; color: var(--btc-orange); display: flex; align-items: center; gap: 8px; }

        .controls { display: flex; gap: 10px; }
        button.tool-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: var(--transition);
            font-weight: 600;
        }
        button.tool-btn:hover { border-color: var(--btc-orange); background: rgba(247, 147, 26, 0.05); }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            width: 100%;
            max-width: 1000px;
        }

        @media (max-width: 900px) { .main-grid { grid-template-columns: 1fr; } }

        .card {
            background: var(--card-bg);
            border-radius: 16px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 30px var(--shadow);
            padding: 24px;
            transition: background-color 0.3s;
            display: flex;
            flex-direction: column;
        }

        .price-value { font-size: 2.2rem; font-weight: 800; margin: 10px 0; color: var(--btc-orange); text-align: center; }
        
        .status-badge {
            display: flex; align-items: center; justify-content: center; gap: 6px;
            color: var(--accent-green); font-size: 0.75rem; font-weight: bold; margin-bottom: 10px;
        }

        .pulse { width: 8px; height: 8px; background: var(--accent-green); border-radius: 50%; animation: pulse-animation 2s infinite; }
        @keyframes pulse-animation {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(36, 210, 125, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(36, 210, 125, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(36, 210, 125, 0); }
        }

        .input-box { position: relative; margin-bottom: 20px; }
        .input-box label { display: block; margin-bottom: 8px; font-size: 0.75rem; color: var(--text-secondary); text-transform: uppercase; }
        .input-wrapper { position: relative; display: flex; align-items: center; }
        .input-wrapper input {
            width: 100%; background: var(--input-bg); border: 1px solid var(--border-color);
            color: var(--text-main); padding: 14px; border-radius: 10px; font-size: 1.1rem; outline: none;
            transition: border 0.2s;
        }
        .input-wrapper input:focus { border-color: var(--btc-orange); }
        
        .copy-btn { position: absolute; right: 10px; background: transparent; border: none; color: var(--text-secondary); cursor: pointer; font-size: 1.1rem; display: flex; align-items: center; }
        .copy-btn:hover { color: var(--btc-orange); }

        .fees-container { margin-top: 20px; border-top: 1px solid var(--border-color); padding-top: 20px; }
        .fees-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
        
        .fee-button {
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            padding: 12px 8px;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .fee-button:hover { border-color: var(--btc-orange); background: rgba(247, 147, 26, 0.05); }
        .fee-button.active { border-color: var(--btc-orange); background: rgba(247, 147, 26, 0.1); }
        
        .fee-label { font-size: 0.65rem; color: var(--text-secondary); text-transform: uppercase; margin-bottom: 4px; }
        .fee-value { font-weight: bold; color: var(--accent-green); font-size: 0.9rem; }

        .fee-estimate-box {
            margin-top: 15px; background: rgba(36, 210, 125, 0.05); border: 1px dashed var(--accent-green);
            padding: 12px; border-radius: 8px; text-align: center; font-size: 0.85rem; color: var(--text-secondary);
        }
        #estimate-text { color: var(--text-main); font-weight: 600; }

        .table-card { overflow-x: auto; margin-top: 10px; max-height: 520px; overflow-y: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 380px; }
        th { text-align: left; padding: 12px; color: var(--text-secondary); font-size: 0.7rem; border-bottom: 1px solid var(--border-color); text-transform: uppercase; position: sticky; top: 0; background: var(--card-bg); z-index: 10; }
        td { padding: 12px; border-bottom: 1px solid var(--border-color); font-size: 0.85rem; }
        .sat-count { font-family: 'Monaco', 'Consolas', monospace; color: var(--btc-orange); font-weight: bold; }
        .btc-unit { font-family: 'Monaco', 'Consolas', monospace; color: var(--text-secondary); font-size: 0.75rem; display: block; }

        .toast {
            position: fixed; bottom: 20px; background: var(--btc-orange); color: white;
            padding: 12px 24px; border-radius: 8px; display: none; z-index: 2000; animation: fadeIn 0.3s;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        footer { margin-top: 40px; text-align: center; color: var(--text-secondary); font-size: 0.75rem; padding-bottom: 20px; }
    </style>
</head>
<body>

    <div id="toast" class="toast">Valor copiado!</div>

    <header>
        <div class="logo">
            <svg width="30" height="30" viewBox="0 0 32 32"><circle cx="16" cy="16" r="16" fill="#F7931A"/><path d="M22.31 14.28c.36-2.45-1.5-3.76-4.04-4.64l.82-3.32-2.02-.5-.8 3.22c-.53-.13-1.08-.26-1.62-.38l.81-3.24-2.02-.5-.82 3.32c-.44-.1-.87-.2-1.29-.3l.01-.01-2.78-.69-.54 2.15s1.5.34 1.46.36c.82.2.96.74.94 1.17l-.94 3.76c.06.01.13.04.21.07l-.21-.05-1.32 5.29c-.1.25-.35.63-.91.49.02.03-1.46-.36-1.46-.36l-.99 2.3 2.63.66c.49.12.96.25 1.43.37l-.83 3.33 2.02.5.82-3.3c.55.15 1.09.29 1.62.42l-.82 3.28 2.02.5.83-3.33c3.45.65 6.04.39 7.13-2.73.88-2.51-.04-3.96-1.86-4.91 1.33-.31 2.33-1.18 2.59-2.98zm-4.64 6.52c-.63 2.52-4.86 1.16-6.24.81l1.11-4.47c1.38.35 5.79.98 5.13 3.66zm.63-6.55c-.57 2.3-4.1 1.13-5.25.85l1.01-4.04c1.15.28 4.84.81 4.24 3.19z" fill="white"/></svg>
            MEMPOOL PRO
        </div>
        <div class="controls">
            <button class="tool-btn" id="currency-toggle"><span id="curr-flag">🇧🇷</span> <span id="curr-text">BRL</span></button>
            <button class="tool-btn" id="theme-btn">🌙</button>
        </div>
    </header>

    <div class="main-grid">
        <div class="card">
            <div class="status-badge"><span class="pulse"></span> REDE ATIVA</div>
            <div class="price-value" id="main-price">Carregando...</div>
            
            <div class="input-box">
                <label>BITCOIN (BTC)</label>
                <div class="input-wrapper">
                    <input type="number" id="btc-input" placeholder="0.00000000" step="0.00000001">
                    <button class="copy-btn" onclick="copyVal('btc-input')">📋</button>
                </div>
            </div>

            <div class="input-box">
                <label id="fiat-label">VALOR EM REAIS (BRL)</label>
                <div class="input-wrapper">
                    <input type="number" id="fiat-input" placeholder="0.00">
                    <button class="copy-btn" onclick="copyVal('fiat-input')">📋</button>
                </div>
            </div>

            <div class="input-box">
                <label>SATOSHIS (SATS)</label>
                <div class="input-wrapper">
                    <input type="number" id="sats-input" placeholder="0" step="1">
                    <button class="copy-btn" onclick="copyVal('sats-input')">📋</button>
                </div>
            </div>

            <div class="fees-container">
                <label style="font-size: 0.75rem; color: var(--text-secondary); margin-bottom: 10px; display: block;">TAXAS DE REDE (ESTIMATIVA DE ENVIO)</label>
                <div class="fees-grid">
                    <div class="fee-button" id="fee-low-btn" onclick="selectFee('low')">
                        <span class="fee-label">Baixa</span>
                        <span class="fee-value" id="fee-low">--</span>
                    </div>
                    <div class="fee-button" id="fee-med-btn" onclick="selectFee('med')">
                        <span class="fee-label">Média</span>
                        <span class="fee-value" id="fee-med">--</span>
                    </div>
                    <div class="fee-button" id="fee-high-btn" onclick="selectFee('high')">
                        <span class="fee-label">Alta</span>
                        <span class="fee-value" id="fee-high">--</span>
                    </div>
                </div>
                <div class="fee-estimate-box" id="fee-estimate">
                    Custo aprox. : <span id="estimate-text">Escolha uma prioridade</span>
                </div>
            </div>
        </div>

        <div class="card">
            <h4 style="margin-top: 0; font-size: 0.85rem; text-transform: uppercase; border-bottom: 1px solid var(--border-color); padding-bottom: 10px;">Tabela de Referência Completa</h4>
            <div class="table-card">
                <table>
                    <thead>
                        <tr>
                            <th>Unidade</th>
                            <th>Satoshis</th>
                            <th style="text-align: right;">Custo Fiat</th>
                        </tr>
                    </thead>
                    <tbody id="ref-table"></tbody>
                </table>
            </div>
        </div>
    </div>

    <footer>
        <p>© 2026 Mempool Pro • Dados em tempo real via CoinGecko & Mempool.space</p>
    </footer>

    <script>
        let btcPriceBRL = 0, btcPriceUSD = 0, currentCurrency = 'BRL';
        let currentFees = { low: 0, med: 0, high: 0 };
        const btcInput = document.getElementById('btc-input');
        const fiatInput = document.getElementById('fiat-input');
        const satsInput = document.getElementById('sats-input');
        
        const referenceLevels = [
            { label: '1 Satoshi', sats: 1 },
            { label: '100 Sats', sats: 100 },
            { label: '1.000 Sats', sats: 1000 },
            { label: '10k Sats', sats: 10000 },
            { label: '50k Sats', sats: 50000 },
            { label: '100k (1 mBTC)', sats: 100000 },
            { label: '500k Sats', sats: 500000 },
            { label: '1M (1% BTC)', sats: 1000000 },
            { label: '5M Sats', sats: 5000000 },
            { label: '10M (10% BTC)', sats: 10000000 },
            { label: '21M (Supply)', sats: 21000000 },
            { label: '50M (50% BTC)', sats: 50000000 },
            { label: '100M (1 BTC)', sats: 100000000 }
        ];

        // Função de busca robusta com retentativas e backoff exponencial
        async function fetchWithRetry(url, options = {}, retries = 5, backoff = 1000) {
            try {
                const response = await fetch(url, options);
                if (!response.ok) throw new Error('Falha na resposta da rede');
                return await response.json();
            } catch (err) {
                if (retries <= 0) throw err;
                await new Promise(resolve => setTimeout(resolve, backoff));
                return fetchWithRetry(url, options, retries - 1, backoff * 2);
            }
        }

        async function updateData() {
            try {
                // Busca de preços
                const pData = await fetchWithRetry('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=brl,usd');
                btcPriceBRL = pData.bitcoin.brl;
                btcPriceUSD = pData.bitcoin.usd;

                // Busca de taxas
                const fData = await fetchWithRetry('https://mempool.space/api/v1/fees/recommended');
                currentFees = { low: fData.hourFee, med: fData.halfHourFee, high: fData.fastestFee };
                
                document.getElementById('fee-low').innerText = currentFees.low;
                document.getElementById('fee-med').innerText = currentFees.med;
                document.getElementById('fee-high').innerText = currentFees.high;
                
                renderUI();
                
                // Atualizar indicação de tempo
                document.getElementById('update-time-info')?.remove();
                const timeInfo = document.createElement('div');
                timeInfo.id = 'update-time-info';
                timeInfo.style.fontSize = '0.7rem';
                timeInfo.style.color = 'var(--text-secondary)';
                timeInfo.style.textAlign = 'center';
                timeInfo.innerText = "Última atualização: " + new Date().toLocaleTimeString('pt-BR');
                document.querySelector('.price-value').after(timeInfo);

            } catch (e) {
                console.error("Erro na conexão:", e);
                document.getElementById('main-price').innerText = "Erro de Conexão";
            }
        }

        function renderUI() {
            const price = currentCurrency === 'BRL' ? btcPriceBRL : btcPriceUSD;
            if(!price) return;

            const symbol = currentCurrency === 'BRL' ? 'R$' : '$';
            const lang = currentCurrency === 'BRL' ? 'pt-BR' : 'en-US';
            
            document.getElementById('main-price').innerText = `${symbol} ${price.toLocaleString(lang, {minimumFractionDigits: 2})}`;
            document.getElementById('fiat-label').innerText = `VALOR EM ${currentCurrency === 'BRL' ? 'REAIS (BRL)' : 'DÓLARES (USD)'}`;
            
            const tbody = document.getElementById('ref-table');
            tbody.innerHTML = '';
            
            referenceLevels.forEach(item => {
                const btc = item.sats / 100000000;
                tbody.innerHTML += `<tr>
                    <td>
                        <div style="font-weight: 600;">${item.label}</div>
                        <span class="btc-unit">${btc.toFixed(8)} BTC</span>
                    </td>
                    <td class="sat-count">${item.sats.toLocaleString(lang)}</td>
                    <td style="text-align: right; color: var(--accent-green); font-weight: bold;">
                        ${symbol} ${(btc * price).toLocaleString(lang, {minimumFractionDigits: 2, maximumFractionDigits: 2})}
                    </td>
                </tr>`;
            });

            const activeFee = document.querySelector('.fee-button.active');
            if(activeFee) selectFee(activeFee.id.split('-')[1]);
        }

        function selectFee(type) {
            document.querySelectorAll('.fee-button').forEach(b => b.classList.remove('active'));
            document.getElementById(`fee-${type}-btn`).classList.add('active');
            
            const fee = currentFees[type];
            const price = currentCurrency === 'BRL' ? btcPriceBRL : btcPriceUSD;
            const symbol = currentCurrency === 'BRL' ? 'R$' : '$';
            const lang = currentCurrency === 'BRL' ? 'pt-BR' : 'en-US';
            
            const costSats = fee * 140; 
            const costFiat = (costSats / 100000000) * price;
            
            document.getElementById('estimate-text').innerText = `${symbol} ${costFiat.toLocaleString(lang, {minimumFractionDigits: 2})} (${costSats.toLocaleString(lang)} sats)`;
        }

        document.getElementById('currency-toggle').onclick = () => {
            currentCurrency = currentCurrency === 'BRL' ? 'USD' : 'BRL';
            document.getElementById('curr-flag').innerText = currentCurrency === 'BRL' ? '🇧🇷' : '🇺🇸';
            document.getElementById('curr-text').innerText = currentCurrency;
            renderUI();
        };

        document.getElementById('theme-btn').onclick = () => {
            const isLight = document.body.classList.toggle('light-mode');
            document.getElementById('theme-btn').innerText = isLight ? '☀️' : '🌙';
        };

        window.copyVal = (id) => {
            const el = document.getElementById(id);
            const area = document.createElement("textarea");
            area.value = el.value;
            document.body.appendChild(area); area.select();
            document.execCommand('copy'); document.body.removeChild(area);
            const t = document.getElementById('toast'); t.style.display='block'; setTimeout(()=>t.style.display='none', 2500);
        };

        btcInput.oninput = () => {
            const btc = parseFloat(btcInput.value) || 0;
            const price = currentCurrency === 'BRL' ? btcPriceBRL : btcPriceUSD;
            fiatInput.value = (btc * price).toFixed(2);
            satsInput.value = Math.round(btc * 100000000);
        };

        fiatInput.oninput = () => {
            const fiat = parseFloat(fiatInput.value) || 0;
            const price = currentCurrency === 'BRL' ? btcPriceBRL : btcPriceUSD;
            const btc = fiat / price;
            btcInput.value = btc.toFixed(8);
            satsInput.value = Math.round(btc * 100000000);
        };

        satsInput.oninput = () => {
            const sats = parseFloat(satsInput.value) || 0;
            const btc = sats / 100000000;
            const price = currentCurrency === 'BRL' ? btcPriceBRL : btcPriceUSD;
            btcInput.value = btc.toFixed(8);
            fiatInput.value = (btc * price).toFixed(2);
        };

        updateData();
        setInterval(updateData, 60000);
    </script>
</body>
</html>
