<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor Bitcoin Pro - Mercado em Tempo Real</title>
    <style>
        :root {
            --bg-color: #0b0e11;
            --card-bg: #1e2329;
            --btc-orange: #f7931a;
            --btc-orange-hover: #e17d00;
            --text-main: #eaecef;
            --text-secondary: #848e9c;
            --border-color: #2b3139;
            --accent-green: #0ecb81;
            --accent-red: #f6465d;
            --input-bg: #2b3139;
            --shadow: rgba(0,0,0,0.5);
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body.light-mode {
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --text-main: #1e2329;
            --text-secondary: #707a8a;
            --border-color: #eaecef;
            --input-bg: #f5f5f5;
            --shadow: rgba(0,0,0,0.05);
        }

        body {
            font-family: 'Inter', -apple-system, system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            transition: background-color 0.4s ease;
            -webkit-font-smoothing: antialiased;
        }

        header {
            width: 100%;
            max-width: 1100px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            gap: 15px;
        }

        .logo { font-size: 1.6rem; font-weight: 800; color: var(--btc-orange); display: flex; align-items: center; gap: 10px; letter-spacing: -0.5px; }

        .controls { display: flex; gap: 12px; }
        button.tool-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px 18px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: var(--transition);
            font-weight: 600;
            box-shadow: 0 2px 4px var(--shadow);
        }
        button.tool-btn:hover { border-color: var(--btc-orange); background: var(--input-bg); transform: translateY(-1px); }
        button.tool-btn:active { transform: translateY(0); }

        .main-grid {
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 24px;
            width: 100%;
            max-width: 1100px;
        }

        @media (max-width: 950px) { .main-grid { grid-template-columns: 1fr; } }

        .card {
            background: var(--card-bg);
            border-radius: 20px;
            border: 1px solid var(--border-color);
            box-shadow: 0 12px 40px var(--shadow);
            padding: 28px;
            position: relative;
            overflow: hidden;
        }

        .price-section { text-align: center; margin-bottom: 30px; }
        .price-value { font-size: 2.8rem; font-weight: 800; margin: 8px 0; color: var(--text-main); }
        .change-badge { font-size: 0.9rem; font-weight: bold; padding: 4px 10px; border-radius: 6px; }
        .change-up { background: rgba(14, 203, 129, 0.15); color: var(--accent-green); }
        .change-down { background: rgba(246, 70, 93, 0.15); color: var(--accent-red); }

        .input-box { margin-bottom: 24px; }
        .input-box label { display: block; margin-bottom: 10px; font-size: 0.8rem; color: var(--text-secondary); font-weight: 600; letter-spacing: 0.5px; }
        .input-wrapper { position: relative; }
        .input-wrapper input {
            width: 100%; background: var(--input-bg); border: 1px solid var(--border-color);
            color: var(--text-main); padding: 18px 50px 18px 18px; border-radius: 14px; font-size: 1.2rem; 
            outline: none; transition: var(--transition); box-sizing: border-box; font-family: 'JetBrains Mono', monospace;
        }
        .input-wrapper input:focus { border-color: var(--btc-orange); box-shadow: 0 0 0 4px rgba(247, 147, 26, 0.15); }
        
        .copy-btn { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); background: transparent; border: none; color: var(--text-secondary); cursor: pointer; font-size: 1.2rem; padding: 5px; border-radius: 6px; transition: var(--transition); }
        .copy-btn:hover { color: var(--btc-orange); background: rgba(247, 147, 26, 0.1); }

        .fees-container { margin-top: 30px; border-top: 1px solid var(--border-color); padding-top: 25px; }
        .fees-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
        
        .fee-button {
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            padding: 15px 10px;
            border-radius: 14px;
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
        }
        .fee-button:hover { border-color: var(--btc-orange); }
        .fee-button.active { border-color: var(--btc-orange); background: rgba(247, 147, 26, 0.1); }
        
        .fee-label { font-size: 0.7rem; color: var(--text-secondary); text-transform: uppercase; margin-bottom: 5px; display: block; }
        .fee-value { font-weight: 800; color: var(--accent-green); font-size: 1rem; }

        .fee-estimate-box {
            margin-top: 20px; background: var(--bg-color); padding: 15px; border-radius: 12px;
            text-align: center; font-size: 0.9rem; border: 1px solid var(--border-color);
        }
        #estimate-text { color: var(--btc-orange); font-weight: 800; }

        .table-card { overflow-x: auto; max-height: 550px; }
        table { width: 100%; border-collapse: separate; border-spacing: 0; }
        th { text-align: left; padding: 15px; color: var(--text-secondary); font-size: 0.75rem; border-bottom: 1px solid var(--border-color); position: sticky; top: 0; background: var(--card-bg); z-index: 10; }
        td { padding: 15px; border-bottom: 1px solid var(--border-color); font-size: 0.9rem; vertical-align: middle; }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: rgba(247, 147, 26, 0.03); }
        .sat-count { font-family: 'JetBrains Mono', monospace; color: var(--btc-orange); font-weight: 700; }
        .btc-unit { font-family: 'JetBrains Mono', monospace; color: var(--text-secondary); font-size: 0.75rem; }

        .toast {
            position: fixed; bottom: 30px; background: #1e2329; color: #f7931a; border: 1px solid #f7931a;
            padding: 15px 30px; border-radius: 12px; display: none; z-index: 9999; font-weight: bold;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); animation: slideUp 0.3s ease-out;
        }
        @keyframes slideUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        footer { margin-top: 50px; text-align: center; color: var(--text-secondary); font-size: 0.8rem; opacity: 0.8; }

        /* Estilo para animação de pulsação suave no status */
        .status-dot { width: 8px; height: 8px; background: var(--accent-green); border-radius: 50%; display: inline-block; box-shadow: 0 0 10px var(--accent-green); }
    </style>
</head>
<body>

    <div id="toast" class="toast">Valor copiado!</div>

    <header>
        <div class="logo">
            <svg width="32" height="32" viewBox="0 0 32 32"><circle cx="16" cy="16" r="16" fill="#F7931A"/><path d="M22.31 14.28c.36-2.45-1.5-3.76-4.04-4.64l.82-3.32-2.02-.5-.8 3.22c-.53-.13-1.08-.26-1.62-.38l.81-3.24-2.02-.5-.82 3.32c-.44-.1-.87-.2-1.29-.3l.01-.01-2.78-.69-.54 2.15s1.5.34 1.46.36c.82.2.96.74.94 1.17l-.94 3.76c.06.01.13.04.21.07l-.21-.05-1.32 5.29c-.1.25-.35.63-.91.49.02.03-1.46-.36-1.46-.36l-.99 2.3 2.63.66c.49.12.96.25 1.43.37l-.83 3.33 2.02.5.82-3.3c.55.15 1.09.29 1.62.42l-.82 3.28 2.02.5.83-3.33c3.45.65 6.04.39 7.13-2.73.88-2.51-.04-3.96-1.86-4.91 1.33-.31 2.33-1.18 2.59-2.98zm-4.64 6.52c-.63 2.52-4.86 1.16-6.24.81l1.11-4.47c1.38.35 5.79.98 5.13 3.66zm.63-6.55c-.57 2.3-4.1 1.13-5.25.85l1.01-4.04c1.15.28 4.84.81 4.24 3.19z" fill="white"/></svg>
            <span id="app-title">Conversor Bitcoin</span>
        </div>
        <div class="controls">
            <button class="tool-btn" id="lang-toggle" aria-label="Alterar Idioma">🌐 <span id="lang-text">English</span></button>
            <button class="tool-btn" id="currency-toggle" aria-label="Alterar Moeda"><span id="curr-flag">🇧🇷</span> <span id="curr-text">BRL</span></button>
            <button class="tool-btn" id="theme-btn">🌙</button>
        </div>
    </header>

    <div class="main-grid">
        <div class="card">
            <div class="status-badge"><div class="status-dot"></div> &nbsp;<span id="status-text">REDE ATIVA</span></div>
            <div class="price-section">
                <div class="price-value" id="main-price">...</div>
                <span id="price-change" class="change-badge">0.00%</span>
            </div>
            
            <div class="input-box">
                <label>BITCOIN (BTC)</label>
                <div class="input-wrapper">
                    <input type="number" id="btc-input" placeholder="0.00000000" step="0.00000001">
                    <button class="copy-btn" onclick="copyVal('btc-input')" title="Copiar BTC">📋</button>
                </div>
            </div>

            <div class="input-box">
                <label id="fiat-label">VALOR EM REAIS (BRL)</label>
                <div class="input-wrapper">
                    <input type="text" id="fiat-input" placeholder="0,00">
                    <button class="copy-btn" onclick="copyVal('fiat-input')" title="Copiar Fiat">📋</button>
                </div>
            </div>

            <div class="input-box">
                <label id="sats-label">SATOSHIS (SATS)</label>
                <div class="input-wrapper">
                    <input type="text" id="sats-input" placeholder="0">
                    <button class="copy-btn" onclick="copyVal('sats-input')" title="Copiar Sats">📋</button>
                </div>
            </div>

            <div class="fees-container">
                <label id="fees-header">TAXAS DE REDE (ESTIMATIVA vBYTE)</label>
                <div class="fees-grid">
                    <div class="fee-button" id="fee-low-btn" onclick="selectFee('low')">
                        <span class="fee-label" id="fee-low-label">Baixa</span>
                        <span class="fee-value" id="fee-low">--</span>
                    </div>
                    <div class="fee-button" id="fee-med-btn" onclick="selectFee('med')">
                        <span class="fee-label" id="fee-med-label">Média</span>
                        <span class="fee-value" id="fee-med" style="color: var(--btc-orange);">--</span>
                    </div>
                    <div class="fee-button" id="fee-high-btn" onclick="selectFee('high')">
                        <span class="fee-label" id="fee-high-label">Alta</span>
                        <span class="fee-value" id="fee-high" style="color: var(--accent-red);">--</span>
                    </div>
                </div>
                <div class="fee-estimate-box">
                    <span id="estimate-prefix">Custo (Tx Padrão):</span> <span id="estimate-text">Escolha a taxa</span>
                </div>
            </div>
        </div>

        <div class="card">
            <h4 id="table-title" style="margin-top: 0; font-size: 0.85rem; text-transform: uppercase; border-bottom: 1px solid var(--border-color); padding-bottom: 15px;">Tabela de Referência</h4>
            <div class="table-card">
                <table>
                    <thead>
                        <tr>
                            <th id="th-unit">Unidade</th>
                            <th id="th-sats">Satoshis</th>
                            <th id="th-fiat" style="text-align: right;">Preço</th>
                        </tr>
                    </thead>
                    <tbody id="ref-table"></tbody>
                </table>
            </div>
        </div>
    </div>

    <footer>
        <p id="footer-text">© 2026 Conversor Pro • Dados: CoinGecko & Mempool.space</p>
    </footer>

    <script>
        const translations = {
            'pt-BR': {
                appTitle: 'Conversor Bitcoin', langText: 'English', statusText: 'REDE ATIVA',
                fiatLabelBRL: 'VALOR EM REAIS (BRL)', fiatLabelUSD: 'VALOR EM DÓLARES (USD)',
                satsLabel: 'SATOSHIS (SATS)', feesHeader: 'TAXAS DE REDE (ESTIMATIVA vBYTE)',
                feeLow: 'Baixa', feeMed: 'Média', feeHigh: 'Alta',
                estimatePrefix: 'Custo (Tx Padrão):', estimatePlaceholder: 'Escolha a taxa',
                tableTitle: 'Tabela de Referência', thUnit: 'Unidade', thSats: 'Satoshis',
                thFiatUSD: 'Preço USD', thFiatBRL: 'Preço BRL', toastCopy: 'Valor copiado!', lastUpdate: 'Atualizado: '
            },
            'en-US': {
                appTitle: 'Bitcoin Converter', langText: 'Português', statusText: 'NETWORK ACTIVE',
                fiatLabelBRL: 'VALUE IN REAIS (BRL)', fiatLabelUSD: 'VALUE IN DOLLARS (USD)',
                satsLabel: 'SATOSHIS (SATS)', feesHeader: 'NETWORK FEES (vBYTE ESTIMATE)',
                feeLow: 'Low', feeMed: 'Medium', feeHigh: 'High',
                estimatePrefix: 'Cost (Std Tx):', estimatePlaceholder: 'Choose fee',
                tableTitle: 'Reference Table', thUnit: 'Unit', thSats: 'Satoshis',
                thFiatUSD: 'USD Price', thFiatBRL: 'BRL Price', toastCopy: 'Value copied!', lastUpdate: 'Updated: '
            }
        };

        let currentLang = localStorage.getItem('pref-lang') || 'pt-BR';
        let currentCurrency = localStorage.getItem('pref-curr') || 'BRL';
        let btcPriceBRL = 0, btcPriceUSD = 0, priceChange24h = 0;
        let currentFees = { low: 0, med: 0, high: 0 };
        
        const btcInput = document.getElementById('btc-input');
        const fiatInput = document.getElementById('fiat-input');
        const satsInput = document.getElementById('sats-input');
        
        const levels = [
            { label: '1 Satoshi', sats: 1 },
            { label: '1k Sats', sats: 1000 },
            { label: '10k Sats', sats: 10000 },
            { label: '100k (1 mBTC)', sats: 100000 },
            { label: '1M (1% BTC)', sats: 1000000 },
            { label: '10M (10% BTC)', sats: 10000000 },
            { label: '1 BTC', sats: 100000000 }
        ];

        function updateLangUI() {
            const t = translations[currentLang];
            document.getElementById('app-title').innerText = t.appTitle;
            document.getElementById('lang-text').innerText = t.langText;
            document.getElementById('status-text').innerText = t.statusText;
            document.getElementById('sats-label').innerText = t.satsLabel;
            document.getElementById('fees-header').innerText = t.feesHeader;
            document.getElementById('fee-low-label').innerText = t.feeLow;
            document.getElementById('fee-med-label').innerText = t.feeMed;
            document.getElementById('fee-high-label').innerText = t.feeHigh;
            document.getElementById('estimate-prefix').innerText = t.estimatePrefix;
            document.getElementById('table-title').innerText = t.tableTitle;
            document.getElementById('th-unit').innerText = t.thUnit;
            document.getElementById('th-sats').innerText = t.thSats;
            document.getElementById('footer-text').innerText = t.footerText;
            
            document.getElementById('fiat-label').innerText = currentCurrency === 'USD' ? t.fiatLabelUSD : t.fiatLabelBRL;
            document.getElementById('th-fiat').innerText = currentCurrency === 'USD' ? t.thFiatUSD : t.thFiatBRL;
            document.getElementById('curr-flag').innerText = currentCurrency === 'USD' ? '🇺🇸' : '🇧🇷';
            document.getElementById('curr-text').innerText = currentCurrency;

            renderUI();
        }

        async function fetchWithRetry(url, options = {}, retries = 3) {
            try {
                const response = await fetch(url, options);
                if (!response.ok) throw new Error('Falha API');
                return await response.json();
            } catch (err) {
                if (retries <= 0) throw err;
                return fetchWithRetry(url, options, retries - 1);
            }
        }

        async function updateData() {
            try {
                const pData = await fetchWithRetry('https://api.coingecko.com/api/v3/coins/bitcoin?localization=false&tickers=false&community_data=false&developer_data=false&sparkline=false');
                btcPriceBRL = pData.market_data.current_price.brl;
                btcPriceUSD = pData.market_data.current_price.usd;
                priceChange24h = pData.market_data.price_change_percentage_24h;

                const fData = await fetchWithRetry('https://mempool.space/api/v1/fees/recommended');
                currentFees = { low: fData.hourFee, med: fData.halfHourFee, high: fData.fastestFee };
                
                document.getElementById('fee-low').innerText = currentFees.low;
                document.getElementById('fee-med').innerText = currentFees.med;
                document.getElementById('fee-high').innerText = currentFees.high;
                
                updatePriceDisplay();
                renderUI();
            } catch (e) { console.error("Update Error", e); }
        }

        function updatePriceDisplay() {
            const price = currentCurrency === 'USD' ? btcPriceUSD : btcPriceBRL;
            const symbol = currentCurrency === 'USD' ? '$' : 'R$';
            const changeEl = document.getElementById('price-change');
            
            document.getElementById('main-price').innerText = `${symbol} ${price.toLocaleString(currentLang, {minimumFractionDigits: 2})}`;
            
            changeEl.innerText = `${priceChange24h > 0 ? '+' : ''}${priceChange24h.toFixed(2)}%`;
            changeEl.className = `change-badge ${priceChange24h >= 0 ? 'change-up' : 'change-down'}`;
        }

        function renderUI() {
            const price = currentCurrency === 'USD' ? btcPriceUSD : btcPriceBRL;
            const symbol = currentCurrency === 'USD' ? '$' : 'R$';
            const tbody = document.getElementById('ref-table');
            tbody.innerHTML = '';
            
            levels.forEach(item => {
                const btc = item.sats / 100000000;
                tbody.innerHTML += `<tr>
                    <td><div>${item.label}</div><span class="btc-unit">${btc.toFixed(8)} BTC</span></td>
                    <td class="sat-count">${item.sats.toLocaleString(currentLang)}</td>
                    <td style="text-align: right; font-weight: bold; color: var(--accent-green)">${symbol} ${(btc * price).toLocaleString(currentLang, {minimumFractionDigits: 2})}</td>
                </tr>`;
            });
            
            const activeFee = document.querySelector('.fee-button.active');
            if(activeFee) selectFee(activeFee.id.split('-')[1]);
        }

        function selectFee(type) {
            document.querySelectorAll('.fee-button').forEach(b => b.classList.remove('active'));
            document.getElementById(`fee-${type}-btn`).classList.add('active');
            const fee = currentFees[type];
            const price = currentCurrency === 'USD' ? btcPriceUSD : btcPriceBRL;
            const costSats = fee * 140; 
            const costFiat = (costSats / 100000000) * price;
            const symbol = currentCurrency === 'USD' ? '$' : 'R$';
            document.getElementById('estimate-text').innerText = `${symbol} ${costFiat.toLocaleString(currentLang, {minimumFractionDigits: 2})} (${costSats.toLocaleString(currentLang)} sats)`;
        }

        // Formatação de Input Numérico para Fiat/Sats
        function formatNumberInput(val) {
            const clean = val.replace(/\D/g, '');
            return clean === '' ? '' : Number(clean).toLocaleString(currentLang);
        }

        function parseFormatted(val) {
            return parseFloat(val.replace(/\./g, '').replace(',', '.')) || 0;
        }

        btcInput.oninput = () => {
            const btc = parseFloat(btcInput.value) || 0;
            const price = currentCurrency === 'USD' ? btcPriceUSD : btcPriceBRL;
            fiatInput.value = (btc * price).toLocaleString(currentLang, {minimumFractionDigits: 2, maximumFractionDigits: 2});
            satsInput.value = Math.round(btc * 100000000).toLocaleString(currentLang);
        };

        fiatInput.oninput = (e) => {
            const val = parseFormatted(e.target.value);
            const price = currentCurrency === 'USD' ? btcPriceUSD : btcPriceBRL;
            const btc = val / price;
            btcInput.value = btc.toFixed(8);
            satsInput.value = Math.round(btc * 100000000).toLocaleString(currentLang);
            e.target.value = formatNumberInput(e.target.value); // Formatação visual
        };

        satsInput.oninput = (e) => {
            const val = parseFormatted(e.target.value);
            const btc = val / 100000000;
            const price = currentCurrency === 'USD' ? btcPriceUSD : btcPriceBRL;
            btcInput.value = btc.toFixed(8);
            fiatInput.value = (btc * price).toLocaleString(currentLang, {minimumFractionDigits: 2});
            e.target.value = formatNumberInput(e.target.value);
        };

        document.getElementById('lang-toggle').onclick = () => {
            currentLang = currentLang === 'pt-BR' ? 'en-US' : 'pt-BR';
            currentCurrency = currentLang === 'pt-BR' ? 'BRL' : 'USD';
            localStorage.setItem('pref-lang', currentLang);
            localStorage.setItem('pref-curr', currentCurrency);
            updateLangUI();
            updatePriceDisplay();
        };

        document.getElementById('currency-toggle').onclick = () => {
            currentCurrency = currentCurrency === 'USD' ? 'BRL' : 'USD';
            localStorage.setItem('pref-curr', currentCurrency);
            updateLangUI();
            updatePriceDisplay();
        };

        document.getElementById('theme-btn').onclick = () => {
            document.body.classList.toggle('light-mode');
            document.getElementById('theme-btn').innerText = document.body.classList.contains('light-mode') ? '☀️' : '🌙';
        };

        window.copyVal = (id) => {
            const el = document.getElementById(id);
            const area = document.createElement("textarea");
            area.value = el.value.replace(/\./g, '').replace(',', '.');
            document.body.appendChild(area); area.select();
            document.execCommand('copy'); document.body.removeChild(area);
            const t = document.getElementById('toast'); 
            t.innerText = translations[currentLang].toastCopy;
            t.style.display='block'; setTimeout(()=>t.style.display='none', 2500);
        };

        updateLangUI();
        updateData();
        setInterval(updateData, 60000);
    </script>
</body>
</html>
